name: Build y Push

on:
  push:
    branches: [master, main]

concurrency:
  group: build-push
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/misiones-lfv:latest
            ghcr.io/${{ github.repository_owner }}/misiones-lfv:sha-${{ github.sha }}

      - name: Disparar deploy en IaC repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "DEPLOY_TOKEN no configurado — deploy automático deshabilitado"
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/esalamancar/single-vps-iac/actions/workflows/misiones-lfv-deploy.yml/dispatches \
            -d '{"ref":"main"}'
